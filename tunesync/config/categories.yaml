# TuneSync 推送场景
#
# 场景 = 喂给大模型的推送主题：LLM 按场景生成仿平台风格的结构化歌单
# （歌名+歌手），再走 本地匹配 → 在线下载 → 刮削 → 写入推送平台。
#
# code   唯一标识，写进 fetch_task.categories 与歌单命名模板
# name   中文名，同时用作 LLM 的场景描述
# group  分组：special | activity | mood | style（前端按此分组展示）
#
# 需要增删场景直接改本文件，重启容器生效。

categories:
# ── 特殊 ─────────────────────────────────────────────
- { code: douyin,      name: 抖音热歌, group: special }

